<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>주유소·충전소 찾기</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, "Malgun Gothic", sans-serif;
        --bg: #f4f4f1;
        --panel: #ffffff;
        --panel-soft: #f7f7f4;
        --line: #d8d8d2;
        --line-soft: #e7e7e1;
        --text: #101010;
        --muted: #5d5d58;
        --faint: #8b8b84;
        --blue: #111111;
        --blue-ink: #111111;
        --green: #007a53;
        --amber: #c86900;
        --red: #bf2d16;
        --cyan: #006f8f;
        --shadow: 0 10px 26px rgba(16, 16, 16, 0.06);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: var(--bg);
        color: var(--text);
      }

      .service-launch-guard {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .service-launch-guard__panel {
        width: min(720px, 100%);
        padding: 28px;
        border: 2px solid #111111;
        border-radius: 6px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .service-launch-guard__panel h1 {
        font-size: 24px;
        margin-bottom: 10px;
      }

      .service-launch-guard__panel p {
        color: var(--muted);
        line-height: 1.6;
      }

      .service-launch-guard__actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-top: 20px;
      }

      .service-launch-guard__url {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--panel-soft);
        font-weight: 800;
      }

      .service-launch-guard__link {
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        padding: 0 14px;
        border-radius: 4px;
        background: #111111;
        color: #ffffff;
        font-weight: 900;
        text-decoration: none;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 16px 18px;
        background: var(--panel);
        border-bottom: 2px solid #111111;
        position: sticky;
        top: 0;
        z-index: 20;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .brand > div:last-child {
        min-width: 0;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 3px;
        background: #111111;
        color: #ffffff;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 20px;
        line-height: 1.25;
        font-weight: 900;
        letter-spacing: 0;
      }

      .subtitle {
        margin-top: 3px;
        color: var(--muted);
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      .top-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 8px;
      }

      .status-pill,
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        max-width: 100%;
        border-radius: 4px;
        border: 1px solid #111111;
        background: #ffffff;
        color: #111111;
        font-size: 12px;
        font-weight: 900;
        line-height: 1;
        padding: 6px 9px;
        white-space: nowrap;
      }

      .status-pill::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--faint);
      }

      .status-pill.ok::before,
      .badge.ok {
        background: #e8f7ef;
        border-color: #b7e2c8;
        color: #11634a;
      }

      .status-pill.ok::before {
        background: var(--green);
      }

      .status-pill.warn::before,
      .badge.warn {
        background: #fff6df;
        border-color: #f2d48f;
        color: #8a4a00;
      }

      .status-pill.warn::before {
        background: var(--amber);
      }

      .status-pill.danger::before,
      .badge.danger {
        background: #fff0eb;
        border-color: #f0b7a3;
        color: #a93412;
      }

      .status-pill.danger::before {
        background: var(--red);
      }

      .badge.info {
        background: #eaf3ff;
        border-color: #bfdbfe;
        color: var(--blue-ink);
      }

      .badge.neutral,
      .severity-text {
        background: #f4f4f2;
        border-color: #d9d9d2;
        color: #475467;
      }

      .badge.cyan {
        background: #e7f7fb;
        border-color: #a9ddeb;
        color: #0b647b;
      }

      main {
        padding: 14px 16px 22px;
      }

      .kpis {
        display: grid;
        grid-template-columns: repeat(6, minmax(140px, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }

      .kpi {
        min-width: 0;
        padding: 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-top: 4px solid #111111;
        border-radius: 3px;
        box-shadow: var(--shadow);
        cursor: pointer;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }

      .kpi:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 18px rgba(17, 17, 17, 0.12);
      }

      .kpi:focus-visible {
        outline: 3px solid #c6d9ff;
        outline-offset: 2px;
      }

      .kpi span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }

      .kpi strong {
        display: block;
        margin-top: 5px;
        font-size: 22px;
        line-height: 1.15;
      }

      .kpi small {
        display: block;
        margin-top: 6px;
        color: var(--faint);
        font-size: 12px;
        line-height: 1.3;
      }

      .kpi.accent {
        border-top: 3px solid var(--blue);
      }

      .kpi.good {
        border-top: 3px solid var(--green);
      }

      .kpi.warn {
        border-top: 3px solid var(--amber);
      }

      .kpi.danger {
        border-top: 3px solid var(--red);
      }

      .shell {
        display: grid;
        grid-template-columns: 292px minmax(0, 1fr) 362px;
        gap: 14px;
        align-items: start;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 3px;
        box-shadow: var(--shadow);
      }

      .filters,
      .inspector {
        position: sticky;
        top: 78px;
        max-height: calc(100vh - 96px);
        overflow: auto;
      }

      .panel-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        padding: 14px 14px 10px;
        border-bottom: 1px solid var(--line-soft);
      }

      .panel-head h2 {
        font-size: 15px;
      }

      .panel-head p {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .filter-body,
      .inspector-body {
        padding: 13px 14px 14px;
      }

      .field {
        margin-bottom: 11px;
      }

      label,
      .field-title {
        display: block;
        margin-bottom: 6px;
        color: #344054;
        font-size: 12px;
        font-weight: 800;
      }

      input,
      select {
        width: 100%;
        min-height: 38px;
        border: 1px solid #c9c9c2;
        border-radius: 3px;
        background: #ffffff;
        color: var(--text);
        padding: 8px 10px;
        outline: none;
      }

      input:focus,
      select:focus,
      .choice.active {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(17, 17, 17, 0.09);
      }

      .choice-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
      }

      .choice,
      .tab,
      .btn {
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: #ffffff;
        color: #111111;
        font-weight: 800;
        font-size: 13px;
      }

      .choice {
        padding: 8px 9px;
        text-align: left;
      }

      .choice.active {
        background: #111111;
        color: #ffffff;
        position: relative;
      }

      .choice.active::after {
        content: "선택됨";
        float: right;
        color: #ffffff;
        font-size: 10px;
        font-weight: 800;
      }

      .button-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 14px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 8px 10px;
      }

      .btn.primary {
        border-color: var(--blue);
        background: var(--blue);
        color: #ffffff;
      }

      .btn.ghost {
        color: var(--blue-ink);
      }

      .btn-icon {
        display: inline-grid;
        place-items: center;
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.18);
        font-size: 12px;
        line-height: 1;
      }

      .btn.ghost .btn-icon {
        background: #eaf3ff;
      }

      .workspace {
        min-width: 0;
      }

      .tabs {
        display: flex;
        align-items: center;
        gap: 0;
        padding: 8px 8px 0;
        overflow-x: auto;
      }

      .tab {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
        margin-right: 6px;
        padding: 10px 13px;
        position: relative;
        white-space: nowrap;
      }

      .tab.active {
        border-color: var(--blue);
        border-bottom-color: #ffffff;
        background: #ffffff;
        color: var(--blue-ink);
        transform: translateY(1px);
        z-index: 2;
      }

      .tab.active::after {
        content: "";
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 5px;
        height: 3px;
        border-radius: 999px;
        background: var(--blue);
      }

      .table-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        padding: 14px;
        border-top: 1px solid var(--blue);
        border-bottom: 1px solid var(--line-soft);
        background: #ffffff;
      }

      .view-kicker {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 7px;
        color: var(--blue-ink);
        font-size: 12px;
        font-weight: 800;
      }

      .view-kicker::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--blue);
      }

      .table-head h2 {
        font-size: 16px;
      }

      .table-head p,
      .meta {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .notice {
        display: none;
        margin: 12px 14px 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel-soft);
        color: #334155;
        padding: 9px 10px;
        font-size: 13px;
        line-height: 1.45;
      }

      .notice.show {
        display: block;
      }

      .notice.error {
        border-color: #f0b7a3;
        background: #fff3ef;
        color: #9a3412;
      }

      .notice.warn {
        border-color: #f2d48f;
        background: #fff8e6;
        color: #8a4a00;
      }

      .table-scroll {
        min-height: 520px;
        max-height: calc(100vh - 276px);
        overflow: auto;
      }

      .table-actions {
        align-items: flex-end;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .btn.compact,
      .action-button {
        min-height: 34px;
        padding: 7px 10px;
      }

      .search-results {
        display: grid;
        gap: 12px;
      }

      .map-panel {
        background:
          linear-gradient(90deg, rgba(17, 17, 17, 0.05) 1px, transparent 1px),
          linear-gradient(rgba(17, 17, 17, 0.04) 1px, transparent 1px),
          #f7f7f4;
        background-size: 44px 44px;
        border-bottom: 1px solid var(--line-soft);
        min-height: 260px;
        overflow: hidden;
        position: relative;
      }

      .map-panel::before {
        color: rgba(17, 17, 17, 0.12);
        content: "전국 위치 보기";
        font-size: 34px;
        font-weight: 900;
        left: 22px;
        position: absolute;
        top: 18px;
      }

      .map-panel.external-map-ready::before {
        display: none;
      }

      .provider-map {
        display: none;
        height: 320px;
        min-height: 260px;
        width: 100%;
      }

      .map-panel.external-map-ready .provider-map {
        display: block;
      }

      .map-panel.external-map-ready .map-fallback {
        display: none;
      }

      .map-fallback {
        inset: 0;
        min-height: 260px;
        position: relative;
      }

      .map-marker {
        --flag-a: #1f64ff;
        --flag-b: #111111;
        --flag-tail: #1748b8;
        align-items: flex-start;
        background: transparent;
        border: 0;
        color: #ffffff;
        cursor: pointer;
        display: inline-flex;
        font-size: 11px;
        font-weight: 900;
        line-height: 1;
        min-height: 36px;
        min-width: 48px;
        padding: 0;
        position: relative;
        text-align: left;
        z-index: 2;
      }

      .map-fallback .map-marker {
        position: absolute;
        transform: translate(-5px, -35px);
      }

      .map-marker.charging {
        --flag-a: #00a86b;
        --flag-b: #00bcd4;
        --flag-tail: #007f72;
      }

      .map-marker.hybrid {
        --flag-a: #ff8a00;
        --flag-b: #e11d48;
        --flag-tail: #b45309;
      }

      .map-marker.provider-flag-marker {
        pointer-events: auto;
      }

      .flag-pole {
        background: #202020;
        border-radius: 999px;
        box-shadow: 0 4px 10px rgba(17, 17, 17, 0.25);
        display: block;
        height: 35px;
        margin-top: 2px;
        width: 3px;
      }

      .flag-face {
        align-items: center;
        background: linear-gradient(135deg, var(--flag-a), var(--flag-b));
        border: 2px solid #ffffff;
        border-radius: 4px 9px 9px 4px;
        box-shadow: 0 9px 20px rgba(17, 17, 17, 0.24);
        display: inline-flex;
        gap: 4px;
        min-width: 42px;
        padding: 5px 7px 5px 6px;
        position: relative;
        transform: translateX(-1px);
      }

      .flag-face::after {
        border-right: 10px solid transparent;
        border-top: 8px solid var(--flag-tail);
        bottom: -8px;
        content: "";
        left: -2px;
        position: absolute;
      }

      .flag-label,
      .flag-index {
        position: relative;
        white-space: nowrap;
        z-index: 1;
      }

      .flag-index {
        background: rgba(255, 255, 255, 0.22);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 999px;
        min-width: 17px;
        padding: 2px 4px;
        text-align: center;
      }

      .map-marker.selected {
        z-index: 4;
      }

      .map-fallback .map-marker.selected {
        transform: translate(-5px, -38px) scale(1.08);
      }

      .map-marker.selected .flag-face {
        outline: 3px solid #111111;
        outline-offset: 2px;
      }

      .map-marker.selected .flag-index {
        background: #ffffff;
        color: #111111;
      }

      .map-cluster {
        align-items: center;
        background: #111111;
        border: 2px solid #ffffff;
        border-radius: 999px;
        box-shadow: 0 10px 22px rgba(17, 17, 17, 0.3);
        color: #ffffff;
        cursor: pointer;
        display: inline-flex;
        font-size: 12px;
        font-weight: 900;
        gap: 4px;
        min-height: 34px;
        min-width: 44px;
        padding: 7px 10px;
        position: relative;
        z-index: 3;
      }

      .map-fallback .map-cluster {
        position: absolute;
        transform: translate(-50%, -50%);
      }

      .map-cluster span {
        color: #00c7a7;
      }

      .map-summary {
        align-items: center;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid var(--line);
        border-radius: 8px;
        bottom: 12px;
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        font-size: 12px;
        font-weight: 700;
        gap: 10px;
        left: 12px;
        padding: 8px 10px;
        position: absolute;
        right: 12px;
        z-index: 5;
      }

      .result-list {
        min-width: 860px;
      }

      .action-button {
        background: #ffffff;
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--blue-ink);
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }

      .action-button:hover {
        background: #eef5ff;
        border-color: #b7cffc;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      th,
      td {
        border-bottom: 1px solid var(--line-soft);
        padding: 9px 10px;
        text-align: left;
        vertical-align: top;
      }

      th {
        position: sticky;
        top: 0;
        z-index: 3;
        background: #f7f9fc;
        color: #475467;
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }

      tr[data-id] {
        cursor: pointer;
      }

      tr[data-id]:hover td {
        background: #f8fbff;
      }

      tr[data-id].selected td {
        background: #eef5ff;
        box-shadow: inset 3px 0 0 var(--blue);
      }

      td {
        color: #273447;
      }

      .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .wrap {
        min-width: 220px;
        max-width: 360px;
        white-space: normal;
        line-height: 1.4;
      }

      .nowrap {
        white-space: nowrap;
      }

      .name-cell {
        min-width: 240px;
        max-width: 320px;
        font-weight: 800;
        color: #13233a;
        white-space: normal;
        line-height: 1.35;
      }

      .name-address {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 400;
        line-height: 1.35;
      }

      .link-button {
        border: 0;
        padding: 0;
        background: transparent;
        color: var(--blue-ink);
        font-weight: 800;
        text-align: left;
      }

      .empty {
        display: grid;
        place-items: center;
        min-height: 300px;
        color: var(--muted);
        text-align: center;
        padding: 24px;
      }

      .empty strong {
        display: block;
        margin-bottom: 6px;
        color: #334155;
        font-size: 15px;
      }

      .inspector-title {
        min-width: 0;
      }

      .inspector-title h2 {
        overflow-wrap: anywhere;
        font-size: 16px;
      }

      .tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }

      .quick-grid,
      .kv-grid {
        display: grid;
        gap: 8px;
      }

      .quick-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-bottom: 12px;
      }

      .quick-item,
      .kv {
        min-width: 0;
        border: 1px solid var(--line-soft);
        border-radius: 6px;
        background: var(--panel-soft);
        padding: 9px;
      }

      .quick-item[data-scroll-target] {
        cursor: pointer;
      }

      .quick-item[data-scroll-target]:hover,
      .quick-item[data-scroll-target]:focus-visible {
        border-color: #93c5fd;
        box-shadow: 0 0 0 2px #dbeafe;
      }

      .quick-item span,
      .kv span {
        display: block;
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
      }

      .quick-item strong,
      .kv strong {
        display: block;
        color: var(--text);
        font-size: 14px;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .kv-grid {
        grid-template-columns: 1fr;
      }

      .detail-section {
        margin-top: 15px;
        padding-top: 13px;
        border-top: 1px solid var(--line-soft);
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }

      .section-title h3 {
        font-size: 14px;
      }

      .mini-scroll {
        max-height: 238px;
        overflow: auto;
        border: 1px solid var(--line-soft);
        border-radius: 6px;
      }

      .candidate-cards {
        display: grid;
        gap: 8px;
      }

      .candidate-card {
        border: 1px solid var(--line-soft);
        border-radius: 6px;
        padding: 8px 10px;
        background: var(--panel-soft);
      }

      .candidate-card .candidate-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }

      .candidate-card .candidate-label {
        color: var(--muted);
        font-size: 11px;
      }

      .candidate-card .candidate-value {
        font-size: 12px;

      }

        font-size: 12px;
      }

      .mini-scroll th,
      .mini-scroll td {
        padding: 7px 8px;
      }

      .mini-empty {
        border: 1px solid var(--line-soft);
        border-radius: 6px;
        background: var(--panel-soft);
        color: var(--muted);
        padding: 10px;
        font-size: 12px;
        text-align: center;
      }

      .pager {
        align-items: center;
        border-top: 1px solid var(--line-soft);
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
        padding: 10px 14px 14px;
      }

      .pager .meta {
        margin-right: auto;
      }

      .detail-note {
        border: 1px solid #dbeafe;
        border-radius: 6px;
        background: #eff6ff;
        color: #1e3a8a;
        font-size: 12px;
        line-height: 1.55;
        margin-top: 10px;
        padding: 10px 12px;
      }

      .detail-note strong {
        display: block;
        color: #172554;
        font-size: 13px;
        margin-bottom: 4px;
      }

      .summary-list {
        display: grid;
        gap: 7px;
      }

      .summary-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--line-soft);
        padding: 7px 0;
        color: #334155;
        font-size: 13px;
      }

      .summary-item strong {
        font-variant-numeric: tabular-nums;
      }

      @media (max-width: 1320px) {
        .kpis {
          grid-template-columns: repeat(3, minmax(160px, 1fr));
        }

        .shell {
          grid-template-columns: 286px minmax(0, 1fr);
        }

        .inspector {
          grid-column: 1 / -1;
          position: static;
          max-height: none;
        }
      }

      @media (max-width: 880px) {
        .topbar,
        .table-head {
          align-items: stretch;
          flex-direction: column;
        }

        .top-actions {
          justify-content: flex-start;
        }

        .kpis {
          grid-template-columns: repeat(2, minmax(130px, 1fr));
        }

        .shell {
          grid-template-columns: 1fr;
        }

        .filters {
          position: static;
          max-height: none;
        }

        .table-scroll {
          max-height: none;
        }

        .workspace,
        .search-results {
          min-width: 0;
          overflow: hidden;
        }

        .table-actions {
          align-items: stretch;
          flex-direction: row;
          flex-wrap: wrap;
          justify-content: space-between;
          width: 100%;
        }

        .table-actions .meta {
          min-width: 0;
        }

        .result-list {
          min-width: 0;
          overflow-x: auto;
        }

        .result-list table {
          min-width: 720px;
        }
      }

      @media (max-width: 560px) {
        main {
          padding: 10px;
        }

        .topbar {
          overflow-x: hidden;
        }

        .brand {
          align-items: flex-start;
        }

        .brand > div:last-child {
          max-width: calc(100vw - 88px);

          grid-template-columns: 1fr;

          align-items: flex-start;
          flex-direction: column;
          gap: 4px;
        }

        h1 {
          font-size: 18px;
        }
      }

  <body>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">ES</div>
        <div>
          <h1>주유소·충전소 찾기</h1>

    <main>
      <section class="kpis" id="kpis" aria-label="핵심 지표"></section>

      <div class="shell">
        <aside class="panel filters">

    </main>

    <script>
      const SERVICE_HTTP_URL = "http://127.0.0.1:8055/";
      if (window.location.protocol === "file:") {
        document.body.innerHTML = `
          <main class="service-launch-guard" data-service-launch-guard="file-protocol">
            <section class="service-launch-guard__panel">
              <h1>서비스 서버로 접속해야 합니다</h1>
              <p>이 화면을 파일로 직접 열면 데이터 API와 지도가 연결되지 않습니다. 로컬 서비스 서버를 실행한 뒤 아래 주소로 접속하세요.</p>
              <div class="service-launch-guard__actions">
                <span class="service-launch-guard__url">${SERVICE_HTTP_URL}</span>
                <a class="service-launch-guard__link" href="${SERVICE_HTTP_URL}">서비스 열기</a>
              </div>
            </section>
          </main>
        `;
        throw new Error("SERVICE_REQUIRES_HTTP");
      }

      const state = {
        view: "search",
        siteCategory: "",
        selectedId: "",
        actor: { actor_id: "", display_name: "", role_code: "", auth_required: false },
        actorLoaded: false,
        canReview: false,
        actorProfileError: "",
        mapConfig: { provider: "OPENFREEMAP", enabled: true },
        tokenKey: "gas_service_token",
        page: 1,
        pageSize: 120,
        runtimeErrors: [],
        serviceStatusTouched: false,
      };

      const initialParams = new URLSearchParams(window.location.search);
      const initialView = initialParams.get("view");
      const initialApiBase = initialParams.get("api_base");
      if (["search", "regions", "review", "geocode", "quality", "precision", "ops"].includes(initialView || "")) {
        state.view = initialView || "search";
        initialParams.delete("view");
      }
      const isHttpUrl = (value) => {
        try {
          const parsed = new URL(String(value));
          return parsed.protocol === "http:" || parsed.protocol === "https:";
        } catch {
          return false;
        }
      };
      const cleanApiBase = (value) => {
        if (!isHttpUrl(value)) return "";
        const trimmed = String(value).trim();
        return trimmed.endsWith("/") ? trimmed.replace(/\/+$/, "") : trimmed;
      };
      const resolvedApiBase = initialApiBase && isHttpUrl(initialApiBase) ? cleanApiBase(initialApiBase) : "";
      if (resolvedApiBase) localStorage.setItem("gas_service_api_base", resolvedApiBase);
      const defaultApiBase = isHttpUrl(window.location.origin) && window.location.protocol !== "file:" ? cleanApiBase(window.location.origin) : "";
      const savedApiBase = cleanApiBase(localStorage.getItem("gas_service_api_base"));
      const fallbackApiBases = [
        "http://127.0.0.1:8055",
        "http://127.0.0.1:8056",
        "http://127.0.0.1:8057",
      ];
      let apiBase = resolvedApiBase || savedApiBase || defaultApiBase || fallbackApiBases[0];
      let apiBaseReady = false;
      let apiBaseInitPromise = null;

      const apiUrl = (path, base = apiBase) => {
        if (!path) return apiBase;
        const text = String(path);
        if (/^[a-z][a-z0-9+.-]*:/i.test(text)) return text;
        const normalized = text.startsWith("/") ? text : `/${text}`;
        return `${base}${normalized}`;
      };

      const resolveApiBase = async () => {
        if (apiBaseReady) return apiBase;
        if (apiBaseInitPromise) return apiBaseInitPromise;
        apiBaseInitPromise = (async () => {
          const token = localStorage.getItem(state.tokenKey) || "";
          const headers = authHeaders(token ? { "X-Service-Token": token } : {});
          const candidates = Array.from(
            new Set(
              [
                resolvedApiBase,
                savedApiBase,
                defaultApiBase,
                ...fallbackApiBases,
                apiBase,
              ]
                .filter(Boolean)
                .map(cleanApiBase),
            ),
          );

          for (const candidate of candidates) {
            try {
              const response = await fetch(apiUrl("/api/energy-sites/summary", candidate), { headers });
              if (!response.ok) {
                if (response.status === 401 && !token) continue;
                continue;
              }
              const payload = await response.json();
              if (!payload?.error && payload?.data) {
                apiBase = candidate;
                localStorage.setItem("gas_service_api_base", candidate);
                return candidate;
              }
            } catch (error) {
              continue;
            }
          }
          apiBase = resolvedApiBase || savedApiBase || defaultApiBase || fallbackApiBases[0];
          return apiBase;
        })();
        const resolved = await apiBaseInitPromise;
        apiBaseReady = true;
        return resolved;
      };
      const localServiceToken = initialParams.get("service_token");
      if (localServiceToken) {
        localStorage.setItem(state.tokenKey, localServiceToken.trim());
        initialParams.delete("service_token");
      }
      if (initialApiBase) {
        initialParams.delete("api_base");
      }
      if (initialView || localServiceToken || initialApiBase) {
        const cleanUrl = `${window.location.pathname}${initialParams.toString() ? `?${initialParams}` : ""}${window.location.hash}`;
        window.history.replaceState({}, "", cleanUrl);
      }

      const loadedMapAssets = new Map();
      let activeProviderMap = null;
      let activeProviderOverlays = [];

      const fields = ["q", "fuel_type", "sido", "sigungu", "service_status", "business_status", "matched", "has_auction", "has_current_auction", "has_storage", "has_equipment", "has_facility", "auction_case_no"];
      const els = {
        apiStatus: document.getElementById("apiStatus"),
        dbStatus: document.getElementById("dbStatus"),
        kpis: document.getElementById("kpis"),
        result: document.getElementById("result"),
        resultMeta: document.getElementById("resultMeta"),
        notice: document.getElementById("notice"),
        inspector: document.getElementById("inspector"),
        viewKicker: document.getElementById("viewKicker"),
        viewTitle: document.getElementById("viewTitle"),
        viewSubtitle: document.getElementById("viewSubtitle"),
        exportCsvBtn: document.getElementById("exportCsvBtn"),
      };

      function recordRuntimeError(source, value) {
        const message = value?.message || String(value || "알 수 없는 화면 오류");
        state.runtimeErrors = [...state.runtimeErrors.slice(-7), { source, message, at: new Date().toISOString() }];
        if (els.notice) setNotice(`화면 오류: ${message}`, "error");
      }

      window.addEventListener("error", (event) => recordRuntimeError("window.error", event.error || event.message));
      window.addEventListener("unhandledrejection", (event) => recordRuntimeError("unhandledrejection", event.reason));

      const viewText = {
        search: ["시설 찾기", "전국 시설 찾기", "주유소와 충전소를 이름, 지역, 연료로 조회합니다."],
        regions: ["지역별 보기", "지역별 시설 현황", "지역마다 시설 수와 운영·휴업·폐업 분포, 건물정보 연결 상태를 봅니다."],
        review: ["확인 필요", "확인해야 할 시설", "주소나 건물정보가 애매해서 사람이 한 번 확인해야 하는 목록입니다."],
        geocode: ["주소 확인", "주소 확인 대기", "주소를 더 정확하게 확인해야 하는 시설을 모아 봅니다."],
        quality: ["데이터 상태", "데이터 점검 결과", "서비스에 보여주기 전 확인해야 할 데이터 문제를 봅니다."],
        precision: ["주소 정확도", "주소 정확도 점검", "주소와 토지 지번이 얼마나 정확하게 연결됐는지 봅니다."],
        ops: ["운영 상태", "서비스 운영 점검", "인증, 지도, 반출 기록, 백업과 갱신 상태를 확인합니다."],
      };

      const columns = {
        search: [
          { key: "site_name", label: "시설명", kind: "name" },
          { key: "site_category", label: "구분", kind: "category" },
          { key: "site_type", label: "시설유형", kind: "siteType" },
          { key: "fuel_types", label: "연료", kind: "fuel" },
          { key: "service_status", label: "운영상태", kind: "status" },
          { key: "auction_status", label: "경매이력", kind: "auctionStatus" },
          { key: "latest_auction_case_no_display", label: "사건번호/외부관리", kind: "wrap" },
          { key: "auction_valid_case_no_count", label: "법원사건", kind: "num" },
          { key: "auction_provider_reference_count", label: "관리번호", kind: "num" },
          { key: "storage_item_count", label: "저장량", kind: "num" },
          { key: "equipment_item_count", label: "설비", kind: "num" },
        ],
        regions: [
          { key: "site_category", label: "구분", kind: "category" },
          { key: "site_type", label: "시설유형", kind: "siteType" },
          { key: "sido", label: "시도" },
          { key: "sigungu", label: "시군구" },
          { key: "service_status", label: "운영상태", kind: "status" },
          { key: "site_count", label: "건수", kind: "num" },
          { key: "operating_count", label: "운영중", kind: "num" },
          { key: "suspended_count", label: "휴업", kind: "num" },
          { key: "closed_count", label: "폐업", kind: "num" },
          { key: "pnu_filled_count", label: "토지 지번 있음", kind: "num" },
          { key: "building_matched_count", label: "건물정보 연결", kind: "num" },
          { key: "storage_site_count", label: "저장량", kind: "num" },
          { key: "equipment_site_count", label: "설비", kind: "num" },
          { key: "auction_site_count", label: "경매이력", kind: "num" },
        ],
        review: [
          { key: "site_name", label: "시설명", kind: "name" },
          { key: "site_category", label: "구분", kind: "category" },
          { key: "priority", label: "우선순위", kind: "priority" },
          { key: "issue_type", label: "확인 항목", kind: "issue" },
          { key: "review_status", label: "상태", kind: "status" },
          { key: "candidate_count", label: "가능 후보", kind: "num" },
          { key: "best_pnu_confidence", label: "정확도", kind: "num" },
          { key: "reason", label: "확인 이유", kind: "wrap" },
          { key: "review_id", label: "처리", kind: "reviewAction" },
        ],
        geocode: [
          { key: "site_name", label: "시설명", kind: "name" },
          { key: "site_category", label: "구분", kind: "category" },
          { key: "provider", label: "확인 방식", kind: "provider" },
          { key: "request_status", label: "상태", kind: "status" },
          { key: "request_type", label: "요청 종류", kind: "requestType" },
          { key: "result_count", label: "결과", kind: "num" },
          { key: "provider_error_code", label: "오류 코드" },
          { key: "request_keyword", label: "요청어", kind: "wrap" },

      const ROLE_LEVELS = { VIEWER: 10, EXPORTER: 20, OPERATOR: 30, AUDITOR: 40, ADMIN: 50 };

      }

      function normalizeRole(value) {
        return normalizeToken(value) || "VIEWER";
      }

      function isRoleAtLeast(role, requiredRole) {
        const current = ROLE_LEVELS[normalizeRole(role)] || 0;
        const required = ROLE_LEVELS[normalizeRole(requiredRole)] || 999;
        return current >= required;
      }

      function labelFrom(group, value) {
        const text = normalizeToken(value);
        return labels[group][text] || value;

        return labels[group][normalizeToken(value)];

      function displayValue(key, value) {
        if (value === null || value === undefined || value === "") return "미확보";

        if (key === "site_type") return labelFrom("siteType", value);
        if (key === "business_status" || key === "review_status" || key === "request_status" || key === "match_method" || key === "status") return labelFrom("status", value);
        if (key === "service_status" || key === "auction_status" || key === "source_status" || key === "search_status" || key === "current_status" || key === "current_candidate_status" || key === "valuation_status" || key === "input_quality_status" || key === "recommendation_status" || key === "planning_status" || key === "prediction_status" || key === "feature_status" || key === "blank_reason_status" || key === "value_status" || key === "candidate_status" || key === "candidate_kind" || key === "preflight_status" || key === "pipeline_status" || key === "blocker_type" || key === "access_status" || key === "data_status" || key === "readiness_status" || key === "intake_status" || key === "session_status" || key === "access_type" || key === "credential_policy") return labelFrom("status", value);

        if (key === "impact_direction") return labelFrom("impactDirection", value);
        if (key === "priority" || key === "gate_priority" || key === "severity") return lookupLabel("priority", value) || lookupLabel("status", value) || value;
        if (key === "issue_type") return labelFrom("issue", value);
        if (key === "provider" || key === "source_provider") return labelFrom("provider", value);

        return items.filter((row) => hasValue(row.capacity_value) && row.capacity_unit && row.source_provider && row.source_dataset).length;

      function storageSummary(items = [], candidates = [], blankReasons = []) {
        const confirmed = confirmedStorageCount(items);
        if (confirmed) return `확정 ${metricValue(confirmed)}건`;
        const sourceRequired = candidates.filter((row) => normalizeToken(row.candidate_status) === "SOURCE_CAPACITY_REQUIRED").length;
        if (sourceRequired) return `용량 원천 필요 ${metricValue(sourceRequired)}건`;

        if (value === null || value === undefined || value === "") return "0%";
        const number = Number(value);

        return `${normalized.toLocaleString(undefined, { maximumFractionDigits: 1 })}%`;

      function statusTone(value) {
        const text = String(value || "").toUpperCase();
        if (["PASS", "OK", "ACTIVE", "OPERATING", "영업", "MATCHED", "PRIMARY", "LOW"].some((word) => text.includes(word))) return "ok";
        if (["WARN", "READY", "PENDING", "REVIEW", "OPEN", "SUSPENDED", "휴업", "미매칭", "REGISTERED", "신규등록"].some((word) => text.includes(word))) return "warn";

      }

      function severityTone(value) {
        const text = String(value || "").toUpperCase();
        if (["ERROR", "FAIL", "HIGH", "BLOCK"].some((word) => text.includes(word))) return "danger";
        if (["WARN", "WARNING", "MEDIUM"].some((word) => text.includes(word))) return "warn";
        if (["LOW", "INFO", "PASS", "OK"].some((word) => text.includes(word))) return "ok";

        const tone = value === "OIL_STATION" ? "info" : value === "HYDROGEN_CHARGING_STATION" ? "ok" : "warn";

        if (["CHARGING_STATION", "LPG_CHARGING_STATION", "CNG_CHARGING_STATION", "LNG_CHARGING_STATION", "LCNG_CHARGING_STATION", "HYDROGEN_CHARGING_STATION"].includes(value)) {
          return badge(categoryLabel(value), "cyan");

        return badge(categoryLabel(value), tone);

        return error;
      }

      function shouldPromptToken(error) {
        return error.status === 401 || ["AUTH_REQUIRED", "INVALID_TOKEN"].includes(error.code);
      }

      function promptToken(error) {
        const token = window.prompt(`${error.message}\n운영 토큰을 입력하세요.`);
        if (!token) return false;
        localStorage.setItem(state.tokenKey, token.trim());
        state.actorLoaded = false;
        actorProfilePromise = null;
        return true;
      }

      let actorProfilePromise = null;

      function applyActorState(actor) {
        const roleCode = normalizeRole(actor?.role_code || "VIEWER");
        state.actor = {
          actor_id: String(actor?.actor_id || ""),
          display_name: String(actor?.display_name || ""),
          role_code: roleCode,
          auth_required: Boolean(actor?.auth_required),
        };
        state.actorLoaded = true;
        state.canReview = isRoleAtLeast(roleCode, "OPERATOR");
        state.actorProfileError = "";
      }

      function clearActorState() {
        state.actor = { actor_id: "", display_name: "", role_code: "VIEWER", auth_required: false };
        state.actorLoaded = true;
        state.canReview = false;
      }

      async function loadActorProfile() {
        if (state.actorLoaded) return state.actor;
        if (actorProfilePromise) return actorProfilePromise;
        actorProfilePromise = (async () => {
          try {
            await resolveApiBase();
            const response = await fetch(apiUrl("/api/admin/auth/me"), { headers: authHeaders({ Accept: "application/json" }) });
            const payload = await response.json();
            if (!response.ok || payload?.error) {
              throw apiError(response, payload || {});
            }
            applyActorState(payload?.actor || {});
          } catch (error) {
            const isAuthRequired = error.status === 401 || error.code === "AUTH_REQUIRED" || error.code === "INVALID_TOKEN";
            state.actorProfileError = isAuthRequired ? "OPERATOR role or higher is required" : (error.message || "권한 확인 실패");
            clearActorState();
            state.actor.auth_required = isAuthRequired;
          } finally {
            actorProfilePromise = null;
            state.actorLoaded = true;
          }
          return state.actor;
        })();
        return actorProfilePromise;
      }

      function refreshActorState() {
        state.actorLoaded = false;
        actorProfilePromise = null;
        state.actorProfileError = "";
        return loadActorProfile();
      }

      async function getJson(path, retried = false) {
        await resolveApiBase();
        const response = await fetch(apiUrl(path), { headers: authHeaders({ Accept: "application/json" }) });
        let payload;
        try {
          payload = await response.json();
        } catch (error) {
          throw new Error(`응답 파싱 실패: ${response.status}`);
        }
        if (!response.ok || payload.error) {
          const error = apiError(response, payload);
          if (!retried && shouldPromptToken(error) && promptToken(error)) return getJson(path, true);
          throw error;
        }
        return payload.data;
      }

      async function sendJson(path, method, body, retried = false) {
        await resolveApiBase();
        const response = await fetch(apiUrl(path), {
          method,
          headers: authHeaders({ Accept: "application/json", "Content-Type": "application/json" }),
          body: JSON.stringify(body || {}),
        });
        const payload = await response.json();
        if (!response.ok || payload.error) {
          const error = apiError(response, payload);
          if (!retried && shouldPromptToken(error) && promptToken(error)) return sendJson(path, method, body, true);
          throw error;
        }
        return payload.data;
      }

      function loadStyleOnce(url) {
        if (!url) return Promise.resolve();
        if (document.querySelector(`link[href="${url}"]`)) return Promise.resolve();
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = url;
        document.head.appendChild(link);
        return Promise.resolve();
      }

      function loadScriptOnce(url, isReady) {
        if (isReady && isReady()) return Promise.resolve();
        if (!loadedMapAssets.has(url)) {
          loadedMapAssets.set(url, new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = url;
            script.async = true;
            script.onload = () => resolve();
            script.onerror = () => reject(new Error(`${url} 로드 실패`));
            document.head.appendChild(script);
          }));
        }
        return loadedMapAssets.get(url).then(() => {
          if (!isReady || isReady()) return;
          throw new Error(`${url} 로드 후 객체를 찾을 수 없습니다.`);
        });
      }

      async function downloadCsv(retried = false) {
        await resolveApiBase();

        if (!response.ok) {
          let payload = {};
          try {
            payload = await response.json();
          } catch (error) {
            payload = { error: { message: `CSV 다운로드 실패: HTTP ${response.status}` } };
          }
          const error = apiError(response, payload);
          if (!retried && shouldPromptToken(error) && promptToken(error)) return downloadCsv(true);
          if (!retried && error.code === "EXPORT_TERMS_REQUIRED") {
            const ok = window.confirm(`${error.message}\n\n${error.details?.body_md || ""}\n\n동의 후 CSV를 다운로드할까요?`);
            if (ok) {
              await sendJson("/api/terms/export/accept", "POST", { terms_version: error.details?.terms_version || "" });
              return downloadCsv(true);
            }
          }
          if (error.code === "EXPORT_APPROVAL_REQUIRED") {
            const reason = window.prompt("5,000건 초과 반출은 승인이 필요합니다. 반출 사유를 입력하세요.", "업무 목적 CSV 반출");
            if (reason) {
              const query = Object.fromEntries(collectParams({ includePaging: false }).entries());
              const request = await sendJson("/api/export-requests", "POST", { query, request_reason: reason });
              throw new Error(`대량 반출 승인 요청을 생성했습니다. 승인 ID: ${request.approval_id}`);
            }
          }
          throw error;
        }
        const blob = await response.blob();
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `energy_sites_export_${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(link.href);
      }

      function filenameFromDisposition(response, fallback) {
        const header = response.headers.get("Content-Disposition") || "";
        const encoded = header.match(/filename\*=UTF-8''([^;]+)/i);
        if (encoded) return decodeURIComponent(encoded[1]);
        const quoted = header.match(/filename="([^"]+)"/i);
        return quoted ? quoted[1] : fallback;
      }

      function renderTable(items, tableColumns) {
        if (!items || !items.length) {
          return `<div class="empty"><div><strong>조회 결과가 없습니다.</strong><span>검색 조건을 조금 넓혀 보세요.</span></div></div>`;
        }
        return `
          <table>
            <thead><tr>${tableColumns.map((column) => `<th>${escapeHtml(column.label)}</th>`).join("")}</tr></thead>
            <tbody>
              ${items
                .map((item) => {
                  const id = item.energy_site_id || "";
                  const selected = id && id === state.selectedId ? " selected" : "";
                  return `<tr class="${selected.trim()}" ${id ? `data-id="${escapeHtml(id)}"` : ""}>${tableColumns.map((column) => renderCell(item, column)).join("")}</tr>`;
                })
                .join("")}
            </tbody>
          </table>
        `;
      }

      function pagingRange(data, items) {
        const total = Number(data.total ?? data.count ?? items.length) || 0;
        const page = Number(data.page || state.page) || 1;
        const pageSize = Number(data.page_size || state.pageSize) || state.pageSize;
        const count = items.length;
        const start = count ? (page - 1) * pageSize + 1 : 0;
        const end = count ? start + count - 1 : 0;
        const pages = Math.max(Math.ceil(total / pageSize), 1);
        return { total, page, pageSize, count, start, end, pages };
      }

      function renderPager(data, items) {
        const range = pagingRange(data, items);
        if (range.total <= range.pageSize && range.page <= 1) return "";
        return `
          <div class="pager">
            <span class="meta">${metricValue(range.total)}건 중 ${metricValue(range.start)}-${metricValue(range.end)}건</span>
            <button class="btn ghost compact" type="button" data-page-action="prev"${range.page <= 1 ? " disabled" : ""}>이전</button>
            <span class="meta">${metricValue(range.page)} / ${metricValue(range.pages)}쪽</span>
            <button class="btn ghost compact" type="button" data-page-action="next"${range.page >= range.pages ? " disabled" : ""}>다음</button>
          </div>
        `;
      }

      function geocodeSummaryNotice(summary) {
        const rows = Array.isArray(summary) ? summary : Object.values(summary || {});
        if (!rows.length) return "";
        const sample = rows
          .slice(0, 3)
          .map((item) => `${displayValue("provider", item.provider)} / ${displayValue("request_status", item.request_status)} ${metricValue(item.count)}건`)
          .join(", ");
        return `주소 확인 상태 종류 ${metricValue(rows.length)}개${sample ? `: ${sample}` : ""}`;
      }

      function numberFrom(item, keys) {
        for (const key of keys) {
          const value = Number(item[key]);
          if (Number.isFinite(value)) return value;
        }
        return null;
      }

      function mapPoints(items) {
        return (items || [])
          .filter((item) => item.map_display_allowed !== false)
          .map((item) => ({
            item,
            id: item.energy_site_id || "",
            lat: numberFrom(item, ["latitude", "lat", "y", "wgs84_lat"]),
            lon: numberFrom(item, ["longitude", "lng", "lon", "x", "wgs84_lon"]),
          }))
          .filter((point) => point.lat !== null && point.lon !== null);
      }

      function clusteredPoints(points) {
        if (points.length <= 60) return points.map((point) => ({ type: "point", point, lat: point.lat, lon: point.lon, count: 1, points: [point] }));
        const selected = [];
        const buckets = new Map();
        points.forEach((point) => {
          if (point.id && point.id === state.selectedId) {
            selected.push({ type: "point", point, lat: point.lat, lon: point.lon, count: 1, points: [point] });
            return;
          }
          const key = `${Math.round(point.lat * 5)}:${Math.round(point.lon * 5)}`;
          const bucket = buckets.get(key) || { type: "cluster", lat: 0, lon: 0, count: 0, points: [] };
          bucket.lat += point.lat;
          bucket.lon += point.lon;
          bucket.count += 1;
          bucket.points.push(point);
          buckets.set(key, bucket);
        });
        const grouped = Array.from(buckets.values()).map((bucket) => {
          if (bucket.count === 1) {
            const point = bucket.points[0];
            return { type: "point", point, lat: point.lat, lon: point.lon, count: 1, points: [point] };
          }
          return { ...bucket, lat: bucket.lat / bucket.count, lon: bucket.lon / bucket.count };
        });
        return [...selected, ...grouped];
      }

      function markerClass(item) {
        if (item.site_category === "CHARGING_STATION") return "charging";
        if (["LPG_CHARGING_STATION", "CNG_CHARGING_STATION", "LNG_CHARGING_STATION", "LCNG_CHARGING_STATION", "HYDROGEN_CHARGING_STATION"].includes(item.site_category)) {
          return "charging";
        }
        if (item.site_category === "HYBRID_FUEL_SITE") return "hybrid";
        return "oil";
      }

      function markerShortLabel(item) {
        if ([
          "CHARGING_STATION",
          "LPG_CHARGING_STATION",
          "CNG_CHARGING_STATION",
          "LNG_CHARGING_STATION",
          "LCNG_CHARGING_STATION",
          "HYDROGEN_CHARGING_STATION",
        ].includes(item.site_category)) return "충";
        if (item.site_category === "HYBRID_FUEL_SITE") return "복";
        return "주";
      }

      function mapMarkerHtml(point, index, options = {}) {
        const id = point.id || "";
        const selected = id && id === state.selectedId ? " selected" : "";
        const title = `${point.item.site_name || "시설"} ${point.item.address_raw || ""}`.trim();
        const tag = options.tag || "button";
        const attrs = tag === "button" ? `type="button" data-map-id="${escapeHtml(id)}"` : `data-map-id="${escapeHtml(id)}"`;
        const markerRole = tag === "button" ? "" : ` role="button"`;
        const providerClass = options.provider ? " provider-flag-marker" : "";
        const style = options.style ? ` style="${options.style}"` : "";
        return `
          <${tag} class="map-marker ${markerClass(point.item)}${providerClass}${selected}" ${attrs}${markerRole}${style} title="${escapeHtml(title)}" aria-label="${escapeHtml(title)}">
            <span class="flag-pole" aria-hidden="true"></span>
            <span class="flag-face">
              <span class="flag-label">${escapeHtml(markerShortLabel(point.item))}</span>
              <span class="flag-index">${index + 1}</span>
            </span>
          </${tag}>
        `;
      }

      function mapClusterHtml(cluster, index, options = {}) {
        const tag = options.tag || "button";
        const style = options.style ? ` style="${options.style}"` : "";
        const attrs = tag === "button" ? `type="button"` : `role="button"`;
        const title = `${cluster.count}개 시설 밀집 지역`;
        return `<${tag} class="map-cluster" ${attrs}${style} title="${escapeHtml(title)}" aria-label="${escapeHtml(title)}"><span>${cluster.count}</span>곳</${tag}>`;
      }

      function renderMap(items) {
        const points = mapPoints(items);
        if (!points.length) {
          return `<div class="empty"><div><strong>지도에 표시할 좌표가 없습니다.</strong><span>목록에서 시설명을 선택해 상세정보를 확인하세요.</span></div></div>`;
        }
        const lats = points.map((point) => point.lat);
        const lons = points.map((point) => point.lon);
        const minLat = Math.min(...lats);
        const maxLat = Math.max(...lats);
        const minLon = Math.min(...lons);
        const maxLon = Math.max(...lons);
        const scale = (value, min, max) => (max === min ? 50 : 8 + ((value - min) / (max - min)) * 84);
        const markers = clusteredPoints(points)
          .map((entry, index) => {
            const left = scale(entry.lon, minLon, maxLon);
            const top = 100 - scale(entry.lat, minLat, maxLat);
            if (entry.type === "cluster") return mapClusterHtml(entry, index, { style: `left:${left}%;top:${top}%;` });
            return mapMarkerHtml(entry.point, index, { style: `left:${left}%;top:${top}%;` });
          })
          .join("");
        return `
          <div class="map-panel" id="mapPanel">
            <div class="provider-map" id="providerMap" aria-label="${escapeHtml(mapProviderLabel())}"></div>
            <div class="map-fallback">
              ${markers}
            </div>
            <div class="map-summary">
              <span id="mapProviderStatus">${state.mapConfig.enabled ? `${mapProviderLabel()} 준비 중` : "내부 좌표지도 표시"}</span>
              <span>지도 표시 ${metricValue(points.length)}건</span>
            </div>
          </div>
        `;
      }

      function renderSearchResults(items) {
        if (!items || !items.length) return renderTable(items, columns.search);
        return `
          <div class="search-results">
            ${renderMap(items)}
            <div class="result-list">${renderTable(items, columns.search)}</div>
          </div>
        `;
      }

      function clearProviderMap() {
        if (activeProviderMap) {
          activeProviderOverlays.forEach((overlay) => activeProviderMap.removeOverlay(overlay));
          activeProviderMap.setTarget(null);
        }
        activeProviderMap = null;
        activeProviderOverlays = [];
      }

      function vworldTileUrl(config) {
        return (config.vworld_tile_url_template || "https://api.vworld.kr/req/wmts/1.0.0/{key}/Base/{z}/{y}/{x}.png")
          .replace("{key}", encodeURIComponent(config.vworld_key || ""));
      }

      async function initSearchMap(items) {
        const panel = document.getElementById("mapPanel");
        const status = document.getElementById("mapProviderStatus");
        const container = document.getElementById("providerMap");
        const points = mapPoints(items);
        if (!panel || !container || !points.length) return;
        if (!state.mapConfig.enabled) {
          clearProviderMap();
          panel.classList.remove("external-map-ready");
          if (status) status.textContent = "외부 지도 비활성: 내부 좌표지도 표시";
          return;
        }
        try {
          const ol = await loadOpenLayers();
          const config = state.mapConfig || {};
          const useVworld = String(config.provider || "").toUpperCase() === "VWORLD" && config.vworld_key;
          clearProviderMap();
          panel.classList.add("external-map-ready");
          container.innerHTML = "";
          const first = ol.proj.fromLonLat([points[0].lon, points[0].lat]);
          const layers = useVworld
            ? [new ol.layer.Tile({
                source: new ol.source.XYZ({
                  url: vworldTileUrl(config),
                  crossOrigin: "anonymous",
                  attributions: "VWorld",
                }),
              })]
            : [];
          activeProviderMap = new ol.Map({
            target: container,
            layers,
            view: new ol.View({
              center: first,
              zoom: 7,
            }),
          });
          if (!useVworld) {
            const olms = await loadOpenFreeMapStyleAdapter();
            await olms.apply(activeProviderMap, config.openfree_style_url || "https://tiles.openfreemap.org/styles/liberty");
          }
          activeProviderMap.updateSize();
          const projectedPoints = [];
          points.forEach((point) => {
            projectedPoints.push(ol.proj.fromLonLat([point.lon, point.lat]));
          });
          clusteredPoints(points).forEach((entry, index) => {
            const projected = ol.proj.fromLonLat([entry.lon, entry.lat]);
            const wrapper = document.createElement("div");
            wrapper.innerHTML = entry.type === "cluster"
              ? mapClusterHtml(entry, index, { tag: "div" }).trim()
              : mapMarkerHtml(entry.point, index, { provider: true }).trim();
            const marker = wrapper.firstElementChild;
            marker.addEventListener("click", (event) => {
              event.preventDefault();
              event.stopPropagation();
              if (entry.type === "cluster") {
                const clusterExtent = ol.extent.boundingExtent(entry.points.map((point) => ol.proj.fromLonLat([point.lon, point.lat])));
                activeProviderMap.getView().fit(clusterExtent, { padding: [46, 46, 46, 46], maxZoom: 13, duration: 250 });
              } else {
                loadDetail(entry.point.id);
              }
            });
            const overlay = new ol.Overlay({
              element: marker,
              position: projected,
              positioning: "bottom-left",
              stopEvent: true,
            });
            activeProviderMap.addOverlay(overlay);
            activeProviderOverlays.push(overlay);
          });
          if (points.length > 1) {
            activeProviderMap.getView().fit(ol.extent.boundingExtent(projectedPoints), {
              padding: [42, 42, 42, 42],
              maxZoom: 14,
            });
          } else {
            activeProviderMap.getView().setZoom(13);
          }
          if (status) status.textContent = `${useVworld ? "VWorld" : "OpenFreeMap"} 표시 중`;
        } catch (error) {
          clearProviderMap();
          panel.classList.remove("external-map-ready");
          if (status) status.textContent = `외부 지도 실패: 내부 좌표지도 표시`;
        }
      }

      function markSelectedRow(id) {
        document.querySelectorAll("tr[data-id]").forEach((row) => row.classList.toggle("selected", row.dataset.id === id));
        document.querySelectorAll("[data-map-id]").forEach((marker) => marker.classList.toggle("selected", marker.dataset.mapId === id));
      }

      async function loadDashboard() {
        const [healthResult, summaryResult, hubResult, actorResult] = await Promise.allSettled([
          getJson("/api/healthz"),
          getJson("/api/energy-sites/summary"),
          getJson("/api/energy-sites/hub-match-stats"),
          loadActorProfile(),
        ]);
        const health = healthResult.status === "fulfilled" ? healthResult.value : {};
        const summary = summaryResult.status === "fulfilled" ? summaryResult.value : {};

      function valueTable(item, rows) {
        return `
          <div class="kv-grid">
            ${rows.map(([label, key]) => `<div class="kv"><span>${escapeHtml(label)}</span><strong>${escapeHtml(displayValue(key, item[key]))}</strong></div>`).join("")}
          </div>
        `;
      }

      function miniTable(items, tableColumns, emptyText = "자료 없음") {
        const rows = items || [];
        if (!rows.length) return `<div class="mini-empty">${escapeHtml(emptyText)}</div>`;
        return `<div class="mini-scroll">${renderTable(rows, tableColumns)}</div>`;
      }

      function actionQueueMetric(summary, priority, field = "count") {
        const row = (summary || []).find((item) => item.priority === priority && item.action_status === "OPEN");
        return row ? row[field] : 0;
      }

      function executionBoardMetric(summary, priority, field = "batch_count") {
        return (summary || [])
          .filter((item) => item.gate_priority === priority)
          .reduce((sum, item) => sum + Number(item[field] || 0), 0);
      }

      function currentAuctionQueueMetric(summary, status) {
        return (summary || [])
          .filter((item) => item.search_status === status)
          .reduce((sum, item) => sum + Number(item.queue_count || 0), 0);
      }

      function miniCards(items, rowDefs, emptyText = "자료 없음") {
        const rows = items || [];
        if (!rows.length) return `<div class="mini-empty">${escapeHtml(emptyText)}</div>`;
        return `
          <div class="candidate-cards">
            ${rows
                      .map(
                        (row) => `
                  <div class="candidate-card">
                    ${rowDefs
                      .map(
                        ({ key, label }) => `<div class="candidate-row">
                          <span class="candidate-label">${escapeHtml(label)}</span>
                          <span class="candidate-value">${escapeHtml(
                            key === "is_primary" ? (row[key] ? "대표지번" : "후보지번") : displayValue(key, row[key])
                          )}</span>
                        </div>`
                      )
                      .join("")}
                  </div>
                `
              )
              .join("")}
          </div>
        `;
      }

      function settledValue(result, fallback) {
        return result.status === "fulfilled" ? result.value : fallback;
      }

      function hasValue(value) {
        return value !== null && value !== undefined && value !== "";
      }

      function firstDefinedValueFrom(item, keys, fallback = "") {
        if (!item) return fallback;
        for (const key of keys) {
          if (hasValue(item[key])) return item[key];
        }
        return fallback;
      }

      function firstValue(items, keys) {
        for (const item of items || []) {
          for (const key of keys) {
            if (hasValue(item?.[key])) return item[key];
          }
        }
        return "";
      }

      function blankReasonFor(items, group) {
        const normalizedGroup = normalizeToken(group);
        return (items || []).find((row) => normalizeToken(row.check_group) === normalizedGroup) || null;
      }

      function blankReasonMessage(items, group, fallback) {
        const reason = blankReasonFor(items, group);
        if (!reason || normalizeToken(reason.value_status) === "READY") return fallback;
        return reason.reason_message || fallback;
      }

      function blankReasonSummary(items, group, fallback) {
        const reason = blankReasonFor(items, group);
        if (!reason) return fallback;
        const status = normalizeToken(reason.value_status);
        if (status === "READY") return fallback;
        return displayValue("value_status", status) || fallback;
      }

      function areaSummaryText(item, area, blankReasons = []) {
        if (hasValue(area.total_land_area_m2)) return `${metricValue(area.total_land_area_m2)} m2`;
        const source = String(area.area_source || "");
        const reason = blankReasonSummary(blankReasons, "LAND", "");
        if (reason) return reason;
        if (!item.pnu || source === "NO_PNU") return "토지 지번 필요";
        if (source) return "면적 원천 없음";
        return "확인 필요";
      }

      function countSummary(count, emptyText) {
        return count > 0 ? `${metricValue(count)}건` : emptyText;
      }

      function detailNote(item, area, related, blankReasons = []) {
        const serviceStatus = item.service_status || item.business_status;
        const notes = [];
        const reasonMessages = (blankReasons || [])
          .filter((row) => !["READY", "NOT_APPLICABLE"].includes(normalizeToken(row.value_status)))
          .map((row) => row.reason_message)
          .filter(Boolean)
          .slice(0, 4);
        notes.push(...reasonMessages);
        if (!item.pnu && !reasonMessages.length) notes.push("토지 지번이 아직 연결되지 않아 토지면적, 건물, 위험시설 상세가 비어 있을 수 있습니다.");
        if (item.pnu && !hasValue(area.total_land_area_m2) && !reasonMessages.length) notes.push("토지 지번은 연결됐지만 표제부/총괄표제부 대지면적을 찾지 못해 총토지면적은 확인 필요입니다.");
        if (item.pnu && !related.buildingCount && !reasonMessages.length) notes.push("토지 지번은 있으나 건축물관리대장 건물 후보가 아직 확정되지 않았습니다.");

        if (
          item.site_category === "OIL_STATION" &&

        if (!notes.length) return "";
        return `<div class="detail-note"><strong>표시 가능한 상세자료 안내</strong>${notes.map(escapeHtml).join("<br>")}</div>`;
      }

                { key: "issue_type", label: "확인 항목", kind: "issue" },
                { key: "reason", label: "확인 이유", kind: "wrap" },
                { key: "review_status", label: "상태", kind: "status" },
              ], "현재 등록된 확인 필요 항목이 없습니다.")}
            </div>
          </div>
        `;
        setNotice(`선택한 시설: ${fmt(item.site_name)} 상세정보를 오른쪽에 표시했습니다.`);
      }

      document.getElementById("categoryChoices").addEventListener("click", (event) => {
        const button = event.target.closest(".choice");
        if (!button) return;
        setCategoryChoice(button.dataset.value || "");
        state.page = 1;
      });

      document.getElementById("service_status").addEventListener("change", () => {
        state.serviceStatusTouched = true;
      });

      document.querySelectorAll(".tab").forEach((button) => {
        button.addEventListener("click", () => {
          state.page = 1;
          loadView(button.dataset.view);
        });
      });

      document.getElementById("searchBtn").addEventListener("click", () => {
        clearImplicitServiceStatus();
        state.page = 1;
        loadView(["search", "regions", "review", "geocode"].includes(state.view) ? state.view : "search");
      });
      els.exportCsvBtn.addEventListener("click", async () => {
        try {
          setNotice("CSV 파일을 준비 중입니다.");
          await downloadCsv();
          setNotice("CSV 다운로드를 시작했습니다.");
        } catch (error) {
          setNotice(error.message, "error");
        }
      });
      document.getElementById("resetBtn").addEventListener("click", () => {
        for (const id of fields) document.getElementById(id).value = "";
        setCategoryChoice("");
        state.serviceStatusTouched = false;
        state.page = 1;
        loadView(["search", "regions", "review", "geocode"].includes(state.view) ? state.view : "search");
      });

      document.querySelector(".filter-body").addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          clearImplicitServiceStatus();
          state.page = 1;
          loadView(["search", "regions", "review", "geocode"].includes(state.view) ? state.view : "search");
        }
      });

      document.getElementById("kpis").addEventListener("click", (event) => {
        const kpi = event.target.closest("[data-kpi-action]");
        if (!kpi) return;
        applyKpiAction(kpi.dataset.kpiAction);
      });

      document.getElementById("kpis").addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const kpi = event.target.closest("[data-kpi-action]");
        if (!kpi) return;
        event.preventDefault();
        applyKpiAction(kpi.dataset.kpiAction);
      });

      els.result.addEventListener("click", (event) => {
        const pageAction = event.target.closest("[data-page-action]");
        if (pageAction) {
          event.stopPropagation();
          if (pageAction.disabled) return;
          state.page = Math.max(1, state.page + (pageAction.dataset.pageAction === "next" ? 1 : -1));
          loadView(state.view);
          return;
        }
        const opsAction = event.target.closest("[data-ops-action]");
        if (opsAction) {
          event.stopPropagation();
          handleOpsAction(opsAction);
          return;
        }
        const reviewAction = event.target.closest("[data-review-action]");
        if (reviewAction) {
          event.stopPropagation();
          resolveReview(reviewAction.dataset.reviewAction);
          return;
        }
        const marker = event.target.closest("[data-map-id]");
        const button = event.target.closest("[data-detail-id]");
        const row = event.target.closest("tr[data-id]");
        const id = marker ? marker.dataset.mapId : button ? button.dataset.detailId : row ? row.dataset.id : "";
        if (id) loadDetail(id);
      });

      els.inspector.addEventListener("click", (event) => {
        const jumpTarget = event.target.closest("[data-scroll-target]");
        if (!jumpTarget) return;
        event.preventDefault();
        scrollToInspectorSection(jumpTarget.dataset.scrollTarget);
      });

      els.inspector.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const jumpTarget = event.target.closest("[data-scroll-target]");
        if (!jumpTarget) return;
        event.preventDefault();
        scrollToInspectorSection(jumpTarget.dataset.scrollTarget);
      });

      async function handleOpsAction(button) {
        const action = button.dataset.opsAction;
        try {
          if (action === "download-action-file") {
            setNotice("작업 파일 다운로드를 준비 중입니다.");
            await downloadActionFile(button.dataset.actionId || "", button.dataset.fileKind || "template");
            setNotice("작업 파일 다운로드를 시작했습니다.");
            return;
          }
          if (action === "download-g3-g5-workpack-file") {
            setNotice("G3~G5 작업팩 다운로드를 준비 중입니다.");
            await downloadG3G5WorkpackFile(button.dataset.workpackId || "", button.dataset.fileKind || "template");
            setNotice("G3~G5 작업팩 다운로드를 시작했습니다.");
            return;
          }
          if (action === "download-auction-first-run-priority") {
            setNotice("경매 1차 우선 조회팩 다운로드를 준비 중입니다.");
            await downloadAuctionFirstRunPriorityFile(button.dataset.fileKind || "template");
            setNotice("경매 1차 우선 조회팩 다운로드를 시작했습니다.");
            return;
          }
          if (action === "download-auction-next-priority-result-pack") {
            setNotice("경매 다음 우선순위 입력팩 다운로드를 준비 중입니다.");
            await downloadAuctionNextPriorityResultPack();
            setNotice("경매 다음 우선순위 입력팩 다운로드를 시작했습니다.");
            return;
          }
          if (action === "download-workboard-preflight") {
            setNotice("작업보드 결과 점검 CSV 다운로드를 준비 중입니다.");
            await downloadWorkboardPreflightCsv(button.dataset.preflightKind || "revenue", button.dataset.preflightStatus || "");
            setNotice("작업보드 결과 점검 CSV 다운로드를 시작했습니다.");
            return;
          }
          if (action === "download-minimum-operator-preflight") {
            setNotice("최소 배치 결과양식 점검 CSV 다운로드를 준비 중입니다.");
            await downloadMinimumOperatorPreflightCsv(button.dataset.preflightStatus || "");
            setNotice("최소 배치 결과양식 점검 CSV 다운로드를 시작했습니다.");
            return;
          }
          if (action === "copy-command") {
            await copyText(button.dataset.command || "");
            setNotice("실행 명령을 복사했습니다.");
            return;
          }
          if (action === "create-token") {
            const displayName = window.prompt("토큰 이름", "Pilot Admin");
            if (!displayName) return;
            const roleCode = (window.prompt("권한: VIEWER, EXPORTER, OPERATOR, AUDITOR, ADMIN", "ADMIN") || "VIEWER").toUpperCase();
            const data = await sendJson("/api/admin/tokens", "POST", { display_name: displayName, role_code: roleCode });
            window.alert(`토큰은 다시 볼 수 없습니다.\n\n${data.token}`);
          }
          if (action === "rotate-token") {
            const data = await sendJson(`/api/admin/tokens/${encodeURIComponent(button.dataset.tokenId)}/rotate`, "POST", {});
            window.alert(`새 토큰은 다시 볼 수 없습니다.\n\n${data.token}`);
          }
          if (action === "revoke-token") {
            if (!window.confirm("이 토큰을 폐기할까요?")) return;
            await sendJson(`/api/admin/tokens/${encodeURIComponent(button.dataset.tokenId)}/revoke`, "POST", {});
          }
          if (action === "accept-export-terms") {
            await sendJson("/api/terms/export/accept", "POST", {});
          }
          if (action === "approve-export") {
            await sendJson(`/api/admin/export-requests/${encodeURIComponent(button.dataset.approvalId)}/approve`, "POST", {});
          }
          if (action === "reject-export") {
            const reason = window.prompt("반려 사유", "승인 기준 미충족") || "";
            await sendJson(`/api/admin/export-requests/${encodeURIComponent(button.dataset.approvalId)}/reject`, "POST", { reason });
          }
          if (action === "run-launch-gates") {
            await sendJson("/api/admin/launch-gates/run", "POST", {});
          }
          if (action === "waive-launch-gate") {
            const waiver = window.prompt("면제 사유", "운영 승인 조건부 면제") || "";
            if (!waiver) return;
            const evidence = window.prompt("증빙 경로", "docs/102_final_commercial_launch_approval_pack_20260603.md") || "";
            await sendJson(`/api/admin/launch-gates/${encodeURIComponent(button.dataset.checkId)}`, "PATCH", {
              check_status: "WAIVED",
              waiver_reason: waiver,
              evidence_path: evidence,
            });
          }
          if (action === "create-launch-approval") {
            const targetVersion = window.prompt("출시 버전", "commercial-1.0") || "commercial-1.0";
            const goLiveWindow = window.prompt("오픈 예정 시간", "2026-06-03 KST") || "";
            await sendJson("/api/admin/launch-approval", "POST", {
              target_version: targetVersion,
              go_live_window: goLiveWindow,
              rollback_plan_path: "docs/102_final_commercial_launch_approval_pack_20260603.md",
              approval_note: "운영 탭에서 생성",
            });
          }
          if (action === "approve-launch") {
            await sendJson(`/api/admin/launch-approval/${encodeURIComponent(button.dataset.launchApprovalId)}/approve`, "POST", {
              approval_note: "최종 출시 승인",
            });
          }
          if (action === "reject-launch") {
            const note = window.prompt("반려 사유", "필수 출시 게이트 미충족") || "";
            await sendJson(`/api/admin/launch-approval/${encodeURIComponent(button.dataset.launchApprovalId)}/reject`, "POST", {
              approval_note: note,
            });
          }
          if (action === "ack-monitor") {
            await sendJson(`/api/admin/monitor-events/${encodeURIComponent(button.dataset.eventId)}/ack`, "POST", {});
          }
          if (action === "resolve-monitor") {
            await sendJson(`/api/admin/monitor-events/${encodeURIComponent(button.dataset.eventId)}/resolve`, "POST", {});
          }
          setNotice("운영 작업을 처리했습니다.");
          loadView("ops");
        } catch (error) {
          setNotice(error.message, "error");
        }
      }

      async function resolveReview(reviewId) {
        if (!reviewId) return;
        if (!state.canReview) {
          setNotice("리뷰 처리 권한이 없습니다. OPERATOR 이상 토큰이 필요합니다.", "error");
          return;
        }
        try {
          setNotice("확인 필요 항목을 처리 중입니다.");
          await sendJson(`/api/admin/review-items/${encodeURIComponent(reviewId)}`, "PATCH", {
            review_status: "RESOLVED",
            review_note: "화면에서 처리 완료",
            reviewer: state.actor.display_name || state.actor.actor_id || "local-admin",
          });
          setNotice("처리 완료로 저장했습니다.");
          loadDashboard();
          loadView("review");
        } catch (error) {
          if (error.status === 403 || error.code === "AUTH_FORBIDDEN") {
            const details = error.details || {};
            const required = details.required_role || "OPERATOR";
            const current = details.actor_role || state.actor.role_code || "UNKNOWN";
            setNotice(`권한 없음: 필요 ${required}, 현재 ${current}`, "error");
            refreshActorState();
            loadDashboard();
            return;
          }
          if (error.code === "AUTH_REQUIRED" || error.status === 401) {
            setNotice("토큰이 없거나 유효하지 않습니다. 상단에서 토큰을 입력하세요.", "error");
            return;
          }
          setNotice(error.message, "error");
        }
      }

      renderKpis();
      renderInspectorHome();
      loadDashboard();
      loadMapConfig().finally(() => loadView(state.view));
    </script>
  </body>
</html>
