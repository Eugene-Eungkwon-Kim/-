# NPL 물건 유형 ↔ rtech 단지 유형 매핑
# NPL 파서 7종에서 사용하는 자산유형명을 rtech/공공API 기준으로 통합

property_type_mapping:
  # 아파트 계열
  아파트: 아파트
  공동주택: 아파트
  아파트(집합): 아파트
  집합건물(아파트): 아파트

  # 다세대/연립 계열
  다세대: 다세대
  다세대주택: 다세대
  연립: 연립
  연립주택: 연립
  빌라: 다세대
  다가구: 다가구
  다가구주택: 다가구

  # 오피스텔 계열
  오피스텔: 오피스텔
  업무용오피스텔: 오피스텔
  주거용오피스텔: 오피스텔

  # 상업/업무 계열
  상가: 상가
  상업시설: 상가
  근린상가: 상가
  근린생활시설: 상가
  판매시설: 상가

  # 토지/기타
  토지: 토지
  나대지: 토지
  임야: 토지
  농지: 토지
  전: 토지
  답: 토지
  대지: 토지

  # 공장/창고
  공장: 공장
  창고: 창고
  물류창고: 창고

  # 기타
  단독주택: 단독주택
  주택: 단독주택
  건물: 기타
  기타: 기타

# rtech 분류 기준 (공식 용어)
rtech_types:
  - 아파트
  - 다세대
  - 연립
  - 오피스텔
  - 단독주택
  - 상가
  - 공장
  - 창고
  - 토지
  - 기타

# AVM 적용 가능 유형 (비교사례 추출 대상)
avm_eligible_types:
  - 아파트
  - 다세대
  - 연립
  - 오피스텔
