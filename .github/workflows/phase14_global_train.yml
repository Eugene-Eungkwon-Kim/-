name: Phase 14 - Global Model Retraining

on:
  schedule:
    - cron: '0 0 1 * *'  # 월 1회 (매월 1일 자정 UTC)
  workflow_dispatch:     # 수동 트리거

jobs:
  retrain-all-countries:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -q numpy pandas scikit-learn xgboost lightgbm openpyxl

      - name: Retrain all 9 countries (parallel)
        run: |
          python scripts/phase13_global_pipeline.py --country KR &
          python scripts/phase13_global_pipeline.py --country BR &
          python scripts/phase13_global_pipeline.py --country SG &
          python scripts/phase13_global_pipeline.py --country HK &
          python scripts/phase13_global_pipeline.py --country UK &
          python scripts/phase13_global_pipeline.py --country DE &
          python scripts/phase13_global_pipeline.py --country AU &
          python scripts/phase13_global_pipeline.py --country CA &
          python scripts/phase13_global_pipeline.py --country TH &
          wait
        continue-on-error: true

      - name: Archive models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrained-models
          path: output/models/
          retention-days: 30

      - name: Check MAPE targets
        run: |
          python scripts/phase14_monitor.py check-mape --threshold 0.105

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Monthly retraining failed. Check logs.'
            })
