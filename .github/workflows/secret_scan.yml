name: Secret Scan

# 이 저장소는 public이고, 과거 커밋에 실제 API 키가 남아 있었다
# (docs/LIMITATIONS.md 참고 — 이미 회전 대상으로 문서화됨). 이 워크플로우는
# "이미 새어나간 것"을 없애주진 못하지만, 앞으로의 커밋에 새 시크릿이
# 섞이는 것은 push마다 잡아낸다.
on:
  push:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
