name: Monthly Transaction Collection

# 4개 자산 유형(주거·공장창고·상업업무용·토지) 실거래를 매월 수집해
# DB에 적재하고 Loan4U 스타일 엑셀로 내보낸다. 스케줄 실행은 항상
# "전월"을 대상으로 한다(실거래 신고는 계약 후 30일 이내라 당월은
# 아직 집계가 끝나지 않는다).
#
# DB는 저장소에 커밋하지 않는다(실거래 데이터는 .gitignore 정책과
# 동일하게 취급) — sqlite 파일과 엑셀을 아티팩트로 남긴다.

on:
  schedule:
    - cron: '0 3 5 * *'  # 매월 5일 03:00 UTC — 전월 실거래 신고 마감 이후
  workflow_dispatch:
    inputs:
      sgg:
        description: '법정동코드 5자리, 공백으로 구분해 여러 개 가능'
        default: '11680'
      year:
        description: '조회 연도 (비우면 전월 자동 계산)'
        default: ''
      month:
        description: '조회 월 1~12 (비우면 전월 자동 계산)'
        default: ''

defaults:
  run:
    working-directory: avm_project

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine target period
        id: period
        run: |
          if [ -z "${{ github.event.inputs.year }}" ]; then
            read -r Y M <<< "$(date -u -d 'last month' +'%Y %m')"
          else
            Y="${{ github.event.inputs.year }}"
            M="${{ github.event.inputs.month }}"
          fi
          echo "year=$Y" >> "$GITHUB_OUTPUT"
          echo "month=$M" >> "$GITHUB_OUTPUT"
          echo "대상 기간: ${Y}-${M}"

      - name: Check secret is registered
        id: check_secret
        run: |
          if [ -z "${{ secrets.DATAGOVKR_DECODING_KEY }}" ]; then
            echo "❌ DATAGOVKR_DECODING_KEY 시크릿이 등록되지 않아 수집을 건너뜁니다."
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect all 4 property types and export Excel
        if: steps.check_secret.outputs.has_secret == 'true'
        env:
          DATAGOVKR_DECODING_KEY: ${{ secrets.DATAGOVKR_DECODING_KEY }}
        continue-on-error: true
        run: |
          python scripts/collect_all_transactions.py \
            --sgg ${{ github.event.inputs.sgg || '11680' }} \
            --year ${{ steps.period.outputs.year }} \
            --month ${{ steps.period.outputs.month }} \
            --export "output/loan4u_upload_${{ steps.period.outputs.year }}${{ steps.period.outputs.month }}.xlsx" \
            2>&1 | tee collect_summary.log

      - name: Job summary
        if: always()
        run: |
          echo "## 📅 ${{ steps.period.outputs.year }}-${{ steps.period.outputs.month }} 실거래 수집" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f collect_summary.log ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat collect_summary.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "시크릿 미등록으로 수집을 건너뛰었습니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload DB and Excel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-collection-${{ steps.period.outputs.year }}${{ steps.period.outputs.month }}
          path: |
            avm_project/data/avm.sqlite
            avm_project/output/loan4u_upload_*.xlsx
            avm_project/collect_summary.log
          retention-days: 90
          if-no-files-found: ignore
