# ============================================================
# AVM Dashboard - 로컬 통합 실행 (백엔드 + 프론트엔드)
#   cd avm_project && docker compose up --build
#   - 백엔드 API:   http://localhost:8000  (문서: /docs)
#   - 프론트엔드:   http://localhost:3000
#
# 클라우드 배포는 성능 검증 전까지 금지(로컬 우선 원칙).
# ============================================================
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avm-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=info
    volumes:
      # 모델/데이터/설정을 읽기전용으로 마운트 → 재빌드 없이 최신본 반영
      - ./models:/app/models:ro
      - ./data:/app/data:ro
      - ./config:/app/config:ro
      # 로그/재학습 이력은 쓰기 가능하게 마운트 (호스트에 영속)
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - avm-network
    labels:
      - "com.avm.description=AVM Dashboard Backend (FastAPI)"
      - "com.avm.version=1.0.0"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: avm-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - avm-network
    labels:
      - "com.avm.description=AVM Dashboard Frontend (Next.js)"
      - "com.avm.version=1.0.0"

networks:
  avm-network:
    driver: bridge
