name: Backend Tests & Docker Build

on:
  push:
    branches: [ main, claude/eloquent-meitner-lqxu9r ]
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/backend-test.yml'
  pull_request:
    branches: [ main, claude/eloquent-meitner-lqxu9r ]
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'docker-compose.yml'

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./avm_project
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pytest
        working-directory: ./avm_project
        run: |
          pytest tests/ -v --tb=short --maxfail=5

      - name: Run E2E WebSocket tests
        working-directory: ./avm_project
        run: |
          pytest tests/test_e2e_websocket.py -v --tb=short

      - name: Test backend imports
        working-directory: ./avm_project
        run: |
          python -c "from backend.main import app; print('✅ main.app imported successfully')"
          python -c "from backend.ml_models import model_manager; print('✅ ml_models.model_manager imported')"
          python -c "from backend.retraining_monitor import monitor; print('✅ retraining_monitor.monitor imported')"

  docker-build:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Validate docker-compose.yml
        working-directory: ./avm_project
        run: |
          docker compose config > /dev/null && echo "✅ docker-compose.yml is valid"

      - name: Build backend Docker image
        working-directory: ./avm_project
        run: |
          docker build -f Dockerfile -t avm-backend:test .
          echo "✅ Backend Docker image built successfully"

      - name: Verify Docker image
        run: |
          docker image ls avm-backend:test
          docker inspect avm-backend:test | head -20

  lint:
    name: Lint Backend Code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 black isort

      - name: Check code formatting with Black
        working-directory: ./avm_project
        run: |
          black backend/ tests/ --check --diff || true

      - name: Check import ordering with isort
        working-directory: ./avm_project
        run: |
          isort backend/ tests/ --check-only --diff || true

      - name: Run flake8
        working-directory: ./avm_project
        run: |
          flake8 backend/ tests/ --max-line-length=100 --extend-ignore=E203,W503 || true

      - name: Run pylint
        working-directory: ./avm_project
        run: |
          pylint backend/*.py tests/*.py --exit-zero --max-line-length=100 || true

  health-check:
    name: Verify Backend Health
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install minimal dependencies
        working-directory: ./avm_project
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn[standard]==0.49.0 pydantic python-dotenv aiofiles

      - name: Start backend and verify health
        working-directory: ./avm_project
        run: |
          timeout 10 python -c "
          import sys, asyncio
          sys.path.insert(0, '.')
          from backend.main import app
          print('✅ Backend app loaded successfully')
          " || true
