name: CI/CD Pipeline (Local)

on:
  push:
    branches: [ main, claude/eloquent-meitner-lqxu9r ]
  pull_request:
    branches: [ main, claude/eloquent-meitner-lqxu9r ]

jobs:
  # Quick validation checks
  validate:
    name: Quick Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Check repository structure
        run: |
          echo "Verifying project structure..."
          test -d avm_project/backend && echo "✅ backend/ exists"
          test -d avm_project/frontend && echo "✅ frontend/ exists"
          test -d avm_project/tests && echo "✅ tests/ exists"
          test -f avm_project/docker-compose.yml && echo "✅ docker-compose.yml exists"
          test -f avm_project/Dockerfile && echo "✅ Dockerfile exists"
          test -f avm_project/backend/requirements.txt && echo "✅ requirements.txt exists"

      - name: List GitHub workflow files
        run: |
          echo "Active CI/CD workflows:"
          ls -1 .github/workflows/*.yml 2>/dev/null | sed 's|.github/workflows/||'

  # Run all workflows in sequence
  backend:
    name: Backend Suite
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./avm_project
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Quick module import test
        working-directory: ./avm_project
        run: |
          python -c "from backend.main import app; print('✅ backend.main loads')"
          python -c "from backend.ml_models import model_manager; print('✅ ml_models loads')"

  frontend:
    name: Frontend Suite
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'avm_project/frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./avm_project/frontend
        run: npm install

      - name: Verify build
        working-directory: ./avm_project/frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker:
    name: Docker Build Suite
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Validate compose file
        working-directory: ./avm_project
        run: docker compose config > /dev/null

      - name: Build backend image
        working-directory: ./avm_project
        run: docker build -f Dockerfile -t avm-backend:ci .

      - name: Build frontend image
        working-directory: ./avm_project/frontend
        run: docker build -t avm-frontend:ci .

      - name: Verify images
        run: |
          docker image ls | grep -E "avm-backend:ci|avm-frontend:ci"
          echo "✅ Docker images built successfully"

  # Final status check
  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [validate, backend, frontend, docker]
    if: always()

    steps:
      - name: Report status
        run: |
          if [ "${{ needs.validate.result }}" = "success" ] && \
             [ "${{ needs.backend.result }}" = "success" ] && \
             [ "${{ needs.frontend.result }}" = "success" ] && \
             [ "${{ needs.docker.result }}" = "success" ]; then
            echo "✅ All CI checks passed!"
            exit 0
          else
            echo "⚠️  Some checks failed or were skipped. Review logs above."
            exit 1
          fi
