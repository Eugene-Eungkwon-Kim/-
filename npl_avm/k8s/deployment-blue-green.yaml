# Blue/Green 배포 설정
# Blue (현재) / Green (다음) 교대로 배포

apiVersion: v1
kind: Namespace
metadata:
  name: npl-avm
---

# ===== Blue Deployment (초기 v1) =====
apiVersion: apps/v1
kind: Deployment
metadata:
  name: npl-avm-blue
  namespace: npl-avm
  labels:
    app: npl-avm
    version: v1
    environment: blue

spec:
  replicas: 3
  selector:
    matchLabels:
      app: npl-avm
      version: v1

  template:
    metadata:
      labels:
        app: npl-avm
        version: v1
        environment: blue

    spec:
      serviceAccountName: npl-avm

      containers:
      - name: npl-avm
        image: ghcr.io/your-org/npl-avm:latest
        imagePullPolicy: IfNotPresent

        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP

        # 환경 변수
        env:
        - name: APP_ENV
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: MODEL_PATH
          value: "/app/models/advanced_best.pkl"

        # 리소스 요청/제한
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

        # 헬스 체크
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /api/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        # 볼륨 마운트
        volumeMounts:
        - name: models
          mountPath: /app/models
          readOnly: true
        - name: logs
          mountPath: /var/log/npl-avm

      # 종료 대기 시간
      terminationGracePeriodSeconds: 30

      # 볼륨
      volumes:
      - name: models
        configMap:
          name: npl-avm-models
      - name: logs
        emptyDir: {}

---

# ===== Green Deployment (초기 비활성) =====
apiVersion: apps/v1
kind: Deployment
metadata:
  name: npl-avm-green
  namespace: npl-avm
  labels:
    app: npl-avm
    version: v2
    environment: green

spec:
  replicas: 0  # 초기에는 비활성
  selector:
    matchLabels:
      app: npl-avm
      version: v2

  template:
    metadata:
      labels:
        app: npl-avm
        version: v2
        environment: green

    spec:
      serviceAccountName: npl-avm

      containers:
      - name: npl-avm
        image: ghcr.io/your-org/npl-avm:latest
        imagePullPolicy: IfNotPresent

        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP

        env:
        - name: APP_ENV
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: MODEL_PATH
          value: "/app/models/advanced_best.pkl"

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /api/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        volumeMounts:
        - name: models
          mountPath: /app/models
          readOnly: true
        - name: logs
          mountPath: /var/log/npl-avm

      terminationGracePeriodSeconds: 30

      volumes:
      - name: models
        configMap:
          name: npl-avm-models
      - name: logs
        emptyDir: {}

---

# ===== Service (초기 Blue로 트래픽) =====
apiVersion: v1
kind: Service
metadata:
  name: npl-avm
  namespace: npl-avm
  labels:
    app: npl-avm

spec:
  type: LoadBalancer
  selector:
    app: npl-avm
    version: v1  # 초기에는 Blue (v1)로 설정

  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP

  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---

# ===== Service Account =====
apiVersion: v1
kind: ServiceAccount
metadata:
  name: npl-avm
  namespace: npl-avm

---

# ===== ConfigMap (모델 메타데이터) =====
apiVersion: v1
kind: ConfigMap
metadata:
  name: npl-avm-models
  namespace: npl-avm

data:
  model_info.json: |
    {
      "model_name": "XGBoost (Tuned)",
      "r2_score": 0.8721,
      "rmse": 446812893,
      "created_at": "2026-06-09",
      "version": "1.0.0"
    }

---

# ===== HorizontalPodAutoscaler =====
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: npl-avm-hpa
  namespace: npl-avm

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: npl-avm-blue

  minReplicas: 2
  maxReplicas: 10

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
